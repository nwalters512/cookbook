title: Split Pea Soup
ingredients:
  - 2 cups split peas, rinsed
  - 3 cups water
  - 1 tablespoon vegetable oil
  - 1 cup diced onion (about 1 medium onion)
  - 1 teaspoon minced garlic (about 2 cloves)
  - 1 cup diced carrot
  - 3/4 cup diced celery
  - 6 cups vegetable broth
  - 2 tablespoons miso
  - 1 bay leaf
  - 1/2 teaspoon liquid smoke
steps:
  - Put the split peas and water into a large pot. Bring to boil over high heat.
  - Cover, reduce heat to low, and simmer for 45 minutes.
  - Transfer peas to a bowl; rinse pot.
  - Heat oil over medium-high heat.
  - Add the onion, garlic, carrot, and celery and saute for 3 to 4 minutes.
  - Add the split peas, broth, miso, bay leaf, and liquid smoke. Cook for 15 minutes or until the vegetables are tender.
  - Remove from heat. Season with salt and pepper to taste.

