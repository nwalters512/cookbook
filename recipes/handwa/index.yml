title: Handwa
description: A savory cake made with Talod Handwa mix.
ingredients:
  - 1 (200 gram) packet Talod Handwa mix
  - 220 ml water (scant 1 cup)
  - 70 grams oil, divided
  - Mustard seeds
  - Cumin seeds
  - Sesame seeds
  - Dried red chili
steps:
  - Mix the Handwa mix, water, and 20 grams of oil in a bowl to form a batter. Let rest for 10 minutes.
  - Heat the remaining 50 grams of oil in a nonstick skillet. Add mustard seeds, cumin seeds, sesame seeds, and dried red chili to make the seasoning mixture.
  - Pour the batter into the skillet. Cover and cook over low heat for 10 to 15 minutes.
  - Flip and cook for another 10 minutes, then serve.
notes:
  - Adapted from the Talod Handwa Mix box. Quantities are for one 200 gram packet.
  - The box uses a 150 ml cup; its 1 1/2 cups of water means 220 ml, not 1 1/2 standard measuring cups.
  - The box does not specify quantities for the mustard seeds, cumin seeds, sesame seeds, or dried red chili.
  - For extra flavor, add green peas, grated bottle gourd, onion, or garlic to the batter.
  - The mix can also be prepared like uttapam.
